</style></head><body><section id="awtar-welcome" dir="rtl" aria-label="أهلاً بك في أوتار"><div class="splash-center"><div class="splash-word" dir="ltr" aria-label="AWTAR">AWTAR</div><div class="splash-accent"></div><h2 class="splash-greeting">أهلاً بك في أوتار</h2><p class="splash-caption">إدارة الرواتب والكادر</p></div><div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="splash-footer">AWTAR STAFF</div><button id="awtar-welcome-enter" type="button" aria-label="تخطي الترحيب">تخطي ←</button></section><header><h1>AWTAR STAFF PRO</h1><p>إدارة موظفي مطعم وكافيه أوتار</p><div class="update-row no-print"><button type="button" id="awtar-update-button" onclick="updateAwtarApp(this)">↻ تحديث البرنامج</button><span id="awtar-update-status" role="status" aria-live="polite">AWTAR · وصولات السفري</span></div><div class="grid" id="summary"></div></header><nav class="tabs" id="tabs"></nav><main class="wrap" id="main"></main><div id="modalroot"></div><script>
const KEY='awtar_staff_pro_v4';
let db, storage, revision, pendingSave=Promise.resolve();

function withEmployeeNumbers(data){
 const all=[...data.workers,...(data.trash||[])],used=new Set();
 let counter=Number.isSafeInteger(data.config?.employeeNumberCounter)?Math.max(0,data.config.employeeNumberCounter):0;
 all.forEach(w=>{if(Number.isSafeInteger(w.employeeNumber)&&w.employeeNumber>0)counter=Math.max(counter,w.employeeNumber);});
 const assign=w=>{
  let number=w.employeeNumber;
  if(!Number.isSafeInteger(number)||number<1||used.has(number))number=++counter;
  used.add(number);
  return {...w,employeeNumber:number};
 };
 return {...data,workers:data.workers.map(assign),trash:(data.trash||[]).map(assign),config:{...data.config,employeeNumberCounter:counter}};
}
function compareWorkerDisplay(a,b){
 const isManager=w=>String(w.name||'').trim().replace(/\s+/g,' ').toLowerCase()==='omar adnan';
 return Number(isManager(b))-Number(isManager(a))||String(a.name||'').localeCompare(String(b.name||''),'ar',{sensitivity:'base'})||String(a.id).localeCompare(String(b.id));
}
function employeeNumber(w){
 const source=db.workers.some(x=>x.id===w.id)?db.workers:(db.trash||[]);
 const list=source.filter(x=>!!x.delivery===!!w.delivery&&(x.active===false)===(w.active===false)).slice().sort(compareWorkerDisplay);
 const index=list.findIndex(x=>x.id===w.id);
 return index<0?'—':String(index+1).padStart(3,'0');
}
async function ensureEmployeeNumbers(){
 const numbered=withEmployeeNumbers(db);
 if(JSON.stringify(numbered)!==JSON.stringify(db)&&!await commitPayrollChange(numbered))throw Error('تعذّر حفظ أرقام الموظفين');
}

function preparePayrollData(data){
  if(!Array.isArray(data?.workers)||!Array.isArray(data.ops))throw Error('بيانات البرنامج غير صالحة');
  data.trash ||= [];
  data.config ||= {departments:['المطبخ','الصالة','الكافيه','الإدارة'],fields:[],business:'مطعم وكافيه أوتار'};
  return data;
}
// Keep backup files and the UI in data-URL format, but store image bytes in IndexedDB.
function mapPayrollImages(data, convert){
  const mapWorkers=workers=>Promise.all(workers.map(async worker=>{
    if(!worker.documents)return worker;
    const entries=await Promise.all(Object.entries(worker.documents).map(async ([key,image])=>[
      key, await convert(image)
    ]));
    return {...worker,documents:Object.fromEntries(entries)};
  }));
  return Promise.all([mapWorkers(data.workers),mapWorkers(data.trash)]).then(async ([workers,trash])=>({
    ...data,workers,trash,ops:await Promise.all(data.ops.map(async op=>({...op,...(op.receipt?{receipt:await convert(op.receipt)}:{})})))
  }));
}
function packPayrollImage(image){
  const match=typeof image==='string'&&/^data:(image\/[\w.+-]+);base64,([A-Za-z0-9+/=]+)$/i.exec(image);
  if(!match)return image;
  const binary=atob(match[2]);
  const bytes=Uint8Array.from(binary,character=>character.charCodeAt(0));
  return new Blob([bytes],{type:match[1]});
}
function unpackPayrollImage(image){
  if(!(image instanceof Blob))return image;
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(image);
  });
}
function payrollTransaction(update){
  return new Promise((resolve,reject)=>{
    const transaction=storage.transaction('state','readwrite');
    const store=transaction.objectStore('state');
    const request=store.get(KEY);
    let result, failure;
    request.onsuccess=()=>{
      try{
        result=update(request.result);
        if(result!==request.result)store.put(result,KEY);
      }catch(error){
        failure=error;
        transaction.abort();
      }
    };
    transaction.oncomplete=()=>resolve(result);
    transaction.onabort=()=>reject(failure||transaction.error||Error('تعذّر حفظ البيانات'));
  });
}
async function loadPayroll(){
  storage=await new Promise((resolve,reject)=>{
    const request=indexedDB.open('awtar_staff_pro_storage',1);
    request.onupgradeneeded=()=>request.result.createObjectStore('state');
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
    request.onblocked=()=>reject(Error('أغلق النسخ الأخرى من البرنامج وحاول مرة ثانية'));
  });
  const record=await payrollTransaction(current=>{
    if(current)return current;
    const legacy=localStorage.getItem(KEY);
    const data=legacy===null?{workers:[],ops:[]}:JSON.parse(legacy);
    return {revision:1,data:preparePayrollData(data)};
  });
  db=await mapPayrollImages(preparePayrollData(record.data),unpackPayrollImage);
  revision=record.revision;
}
function persistPayroll(data){
  const snapshot=JSON.parse(JSON.stringify(data));
  const write=pendingSave.then(async()=>{
    const packed=await mapPayrollImages(snapshot,packPayrollImage);
    const saved=await payrollTransaction(current=>{
      if(current?.revision!==revision)throw Error('تغيّرت البيانات في نافذة ثانية. احتفظ بنسخة احتياطية قبل إعادة فتح البرنامج.');
      return {revision:revision+1,data:packed};
    });
    revision=saved.revision;
  });
  pendingSave=write.catch(()=>{});
  return write;
}
function payrollSaveError(error){
  alert(error.name==='QuotaExceededError'
    ? 'مساحة تخزين الصور غير كافية. نزّل نسخة احتياطية واحذف الصور غير اللازمة.'
    : error.message?.startsWith('تغيّرت البيانات')
      ? error.message
      : 'تعذّر حفظ التغيير على الجهاز. نزّل نسخة احتياطية قبل إغلاق البرنامج.');
}
async function save(){
  try{await persistPayroll(db);return true}
  catch(error){payrollSaveError(error);return false}
}
async function commitPayrollChange(data){
  data=withEmployeeNumbers(data);
  document.body.inert=true;
  try{
    await persistPayroll(data);
    db=data;
    return true;
  }catch(error){
    payrollSaveError(error);
    return false;
  }finally{
    document.body.inert=false;
  }
}
async function changeDocument(id,key,image){
  const worker=db.workers.find(w=>w.id===id);
  if(!worker)return false;
  const documents={...worker.documents};
  if(image)documents[key]=image;
  else delete documents[key];
  const workers=db.workers.map(w=>w===worker?{...worker,documents}:w);
  return commitPayrollChange({...db,workers});
}
async function startPayroll(){
  const status=document.createElement('p');
  status.setAttribute('role','status');
  status.style.padding='16px';
  status.textContent='جارٍ فتح بيانات برنامج الرواتب…';
  document.body.append(status);
  try{
    await loadPayroll();
    await ensureEmployeeNumbers();
    await applyNasserFixedSalary();
    render();
    status.remove();
  }catch(error){
    status.textContent='تعذّر فتح بيانات الرواتب. أغلق أي نسخة ثانية من البرنامج ثم حاول مرة ثانية. ';
    const retry=document.createElement('button');
    retry.textContent='إعادة المحاولة';
    retry.onclick=()=>location.reload();
    status.append(retry);
  }

c((w.custom||{})[f.id]||'')}">`).join('')}<label>رقم الهاتف</label><input name="phone" value="${esc(w.phone||'')}"><label>تاريخ المباشرة</label>${dateFields("start",w.start)}${w.delivery?`<label><input type="checkbox" name="fixedDeliverySalary" style="width:auto" ${w.salaryMode==='fixed'?'checked':''} onchange="toggleWorkerSalary(this.form)"> راتب شهري ثابت للدلفري</label>`:''}<div id="salaryFields" ${w.delivery&&w.salaryMode!=='fixed'?'hidden':''}><label>الراتب الشهري بالدينار *</label><input name="salary" type="number" min="0" required ${w.delivery&&w.salaryMode!=='fixed'?'disabled':''} value="${esc(w.salary??'')}"><p class="muted">للدلفري بالراتب الثابت: المبلغ الشهري يحل محل مستحق الطلبات، وتبقى السحوبات والخصومات والنسبة حسب العمليات المسجلة.</p></div><p><button class="primary" type="submit">حفظ العامل</button></p></form>`)}function toggleWorkerSalary(form){

async function saveWorker(e,id){
  e.preventDefault();
  const f=e.target;
  const start=readDate(f,'start');
  if(!start){alert('تاريخ المباشرة غير صحيح');return}
  const delivery=f.elements.workerListType.value==='delivery';
  const existing=db.workers.find(w=>w.id===id);
  const fixed=delivery&&!!f.elements.fixedDeliverySalary?.checked;
  const salary=delivery&&!fixed?(existing?.salary??0):Number(f.elements.salary.value);
  if((!delivery||fixed)&&(!Number.isFinite(salary)||salary<0)){alert('الراتب الشهري غير صحيح');return}
  if(id&&!existing)return;
  const worker={
    ...(existing||{id:crypto.randomUUID(),active:true}),
    name:f.elements.name.value,
    job:f.elements.job.value,
    phone:f.elements.phone.value,
    department:f.elements.department.value,
    delivery,
    start,
    salary,
    salaryMode:delivery?(fixed?'fixed':'orders'):'monthly',
    custom:{...existing?.custom}
  };
  db.config.fields.forEach(field=>worker.custom[field.id]=f.elements['custom_'+field.id]?.value||'');
  const workers=existing?db.workers.map(w=>w===existing?worker:w):[...db.workers,worker];
  if(!await commitPayrollChange({...db,workers}))return;
  selected=worker.id;
  tab=workerTab(worker);
  closeModal();
  render();
}

async function applyNasserFixedSalary(){
 const key='nasser-fixed-salary-750000-v1';

 if(matches.length!==1)return;
 const worker=matches[0];
 const data={...db,workers:db.workers.map(w=>w===worker?{...w,salary:750000,salaryMode:'fixed'}:w),config:{...db.config,appliedUpdates:[...(db.config.appliedUpdates||[]),key]}};
 if(!await commitPayrollChange(data))throw Error('تعذّر حفظ راتب ناصر الثابت');
}

  return '<p class="muted">اكتب مبلغ كل وصل واضغط إضافة؛ العدد والمجموع ينحسبن تلقائياً.</p>'+

function deliveryReceiptRow(rate,count){
  return '<div class="item between" data-order-receipt><span>'+fmt(rate)+(count===1?' — وصل واحد':' × '+count+' طلب (سجل سابق)')+'</span><input type="hidden" data-order-rate="'+rate+'" value="'+count+'"><button type="button" class="danger smallbtn" onclick="const f=this.form;this.closest(\'[data-order-receipt]\').remove();updateOrderTotals(f)">حذف</button></div>';
}
function parseDeliveryReceipt(value){
  const text=String(value).trim().replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));
  if(!/^(?:\d+|\d{1,3}(?:[,٬]\d{3})+)$/.test(text))throw Error('أدخل مبلغاً صحيحاً مثل 2,500');
  const amount=Number(text.replace(/[,٬]/g,''));
  if(!Number.isSafeInteger(amount)||amount<=0)throw Error('مبلغ الوصل لازم يكون أكبر من صفر');
  return amount;
}
function addDeliveryReceipt(form){
  const input=form.querySelector('#deliveryReceiptAmount'),status=form.querySelector('[data-order-status]');
  try{
    const amount=parseDeliveryReceipt(input.value),current=orderTotals(form);
    if(!Number.isSafeInteger(current.amount+amount)||!Number.isSafeInteger(current.count+1))throw Error('المجموع أكبر من الحد المسموح');
    form.querySelector('[data-order-receipts]').insertAdjacentHTML('beforeend',deliveryReceiptRow(amount,1));
    input.value='';input.setCustomValidity('');status.textContent='';updateOrderTotals(form);input.focus();
  }catch(error){status.textContent=error.message;}
}
function orderTotals(form){
  const breakdown=Array.from(form.querySelectorAll('[data-order-rate]'),input=>({
    rate:Number(input.dataset.orderRate),count:Number(input.value)
  })).filter(entry=>entry.count!==0);
  const count=breakdown.reduce((total,entry)=>total+entry.count,0);
  const amount=breakdown.reduce((total,entry)=>total+entry.count*entry.rate,0);
  return {breakdown,count,amount};
}
function updateOrderTotals(form){
  const {count,amount}=orderTotals(form);
  form.elements.orderCount.value=count;
  form.elements.amount.value=amount;
}
function updateDeliveryPreview(form){
  form.elements.amount.value=Number(form.elements.days.value)*Number(form.elements.rate.value);
}

function scanHomography(points){

let payrollStatementQueue=[],payrollStatementOpened=new Set(),payrollStatementMonth='',payrollStatementSkipped=[];
function preparePayrollStatements(){
 payrollStatementMonth=period;
 payrollStatementOpened=new Set();
 payrollStatementSkipped=[];
 payrollStatementQueue=[];
 db.workers.filter(eligible).forEach(w=>{
  const phone=normalizePhone(w.phone);
  if(!phone||/^964(?!7\d{9}$)/.test(phone)){payrollStatementSkipped.push(w.name);return;}
  payrollStatementQueue.push({name:w.name,phone,text:statement(w,false)});
 });

}
function drawPayrollStatementQueue(){
 modal('<div class="between"><h2>إرسال كشوف الرواتب</h2><button onclick="closeModal()">إغلاق ×</button></div><p>دورة الراتب: '+esc(payrollStatementMonth)+'</p><p>كل زر يفتح كشف الشخص وحده. اضغط إرسال داخل واتساب، ثم ارجع وافتح التالي. فتح المحادثة لا يؤكد الإرسال.</p><p class="muted">الأرقام الصالحة: '+payrollStatementQueue.length+' · الأرقام الناقصة أو غير الصالحة المتجاوزة: '+payrollStatementSkipped.length+'</p><button class="primary" onclick="openNextPayrollStatement()" '+(payrollStatementOpened.size>=payrollStatementQueue.length?'disabled':'')+'>فتح الكشف التالي في واتساب</button>'+payrollStatementQueue.map((w,i)=>'<div class="item between"><div><strong>'+esc(w.name)+'</strong><div class="muted"><bdi>+'+w.phone+'</bdi></div></div><button onclick="openPayrollStatement('+i+')">'+(payrollStatementOpened.has(i)?'فُتحت المحادثة · فتح مجدداً':'إرسال كشفه بواتساب')+'</button></div>').join('')+(payrollStatementQueue.length?'':'<p>لا توجد أرقام صالحة لهذه الدورة.</p>')+(payrollStatementSkipped.length?'<details><summary>الأسماء المتجاوزة</summary><p>'+payrollStatementSkipped.map(esc).join('، ')+'</p></details>':'')+'<p class="muted">إذا الرقم غير مشترك بواتساب، تجاوزه وافتح التالي. الكشوف مجهّزة وقت فتح القائمة؛ بعد أي صرف جديد أغلقها وجهّزها من جديد.</p>');

function openPayrollStatement(index){

function openNextPayrollStatement(){

}

function backup(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='awtar-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(e){

const docTypes=[['workerPhoto','صورة العامل الشخصية'],['nationalFront','البطاقة الموحدة - الوجه الأمامي'],['nationalBack','البطاقة الموحدة - الوجه الخلفي'],['residence','بطاقة السكن - الوجه الأمامي'],['residenceBack','بطاقة السكن - الوجه الخلفي']];
function openDocuments(id){

        <input hidden id="gallery-${key}" type="file" accept="image/*" onchange="${handler}">
        <button type="button" onclick="document.getElementById('camera-${key}').click()">فتح الكاميرا</button>
        <input hidden id="camera-${key}" type="file" accept="image/*" capture="${key==='workerPhoto'?'user':'environment'}" onchange="${handler}">
      </div>
      ${photo?`<img src="${esc(photo)}" style="max-width:100%;max-height:200px;object-fit:contain;border-radius:8px">
        <div><button onclick="deleteDocument('${id}','${key}')">حذف الصورة</button></div>`:'<div class="muted">لم تُرفع صورة بعد</div>'}
    </div>`;
  }).join('');
  modal(`<div class="between"><h2>مستمسكات ${esc(worker.name)}</h2><button onclick="closeModal()">إغلاق ×</button></div>
    <p class="muted">تقدر تقصّ الصورة قبل الحفظ. الصور محفوظة على هذا الجهاز وتدخل ضمن النسخة الاحتياطية.</p>
    ${fields}<button class="primary" onclick="printDocuments('${id}')">معاينة وطباعة المستمسكات بورقة واحدة</button>`);

function saveDocument(e,id,k){
  const input=e.target,file=input.files?.[0];
  if(!file)return;
  input.value='';
  if(file.type&&!file.type.startsWith('image/')){alert('اختر صورة');return}
  const url=URL.createObjectURL(file),im=new Image();
  im.onerror=()=>{
    URL.revokeObjectURL(url);
    if(input.isConnected)alert('تعذّر فتح الصورة. جرّب صورة ثانية.');
  };
  im.onload=()=>{
    URL.revokeObjectURL(url);
    if(input.isConnected)openDocumentCrop(im,id,k);
  };
  im.src=url;
}
function openDocumentCrop(im,id,k){
  const edges=[['left','يسار'],['right','يمين'],['top','أعلى'],['bottom','أسفل']];
  modal(`<div class="between"><h2>قصّ الصورة</h2><button id="cropCancel">إلغاء</button></div>
    <p class="muted">حرّك الأشرطة حتى تبقى الصورة المطلوبة داخل الإطار، وبعدها اضغط حفظ الصورة.</p>
    <div id="cropPreview" dir="ltr" style="position:relative;overflow:hidden;margin:0 auto;width:fit-content;max-width:100%">
      <div id="cropFrame" style="position:absolute;inset:0;border:2px solid #fff;box-shadow:0 0 0 100vmax #0009;pointer-events:none"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0">
      ${edges.map(([edge,label])=>`<label>${label}<input id="crop-${edge}" style="width:100%" dir="ltr" type="range" min="0" max="90" value="0"></label>`).join('')}
    </div>
    <button id="cropSave" class="primary">حفظ الصورة</button> <button id="cropReset">إعادة ضبط القصّ</button>`);
  const preview=document.getElementById('cropPreview'),frame=document.getElementById('cropFrame');
  im.alt='معاينة الصورة قبل الحفظ';
  im.style.cssText='display:block;max-width:100%;max-height:36vh;width:auto;height:auto';
  preview.prepend(im);
  const controls=Object.fromEntries(edges.map(([edge])=>[edge,document.getElementById('crop-'+edge)]));
  const opposite={left:'right',right:'left',top:'bottom',bottom:'top'};
  function updateFrame(){
    for(const [edge] of edges)frame.style[edge]=controls[edge].value+'%';
  }
  for(const [edge] of edges){
    controls[edge].oninput=()=>{
      controls[edge].value=Math.min(+controls[edge].value,90-Number(controls[opposite[edge]].value));
      updateFrame();
    };
  }
  document.getElementById('cropReset').onclick=()=>{
    for(const [edge] of edges)controls[edge].value=0;
    updateFrame();
  };
  document.getElementById('cropCancel').onclick=()=>openDocuments(id);
  document.getElementById('cropSave').onclick=async()=>{
    const left=Number(controls.left.value),right=Number(controls.right.value);
    const top=Number(controls.top.value),bottom=Number(controls.bottom.value);
    const width=im.naturalWidth*(100-left-right)/100,height=im.naturalHeight*(100-top-bottom)/100;
    const maxEdge=k==='workerPhoto'?640:1300;
    const scale=Math.min(1,maxEdge/Math.max(width,height)),canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(width*scale));
    canvas.height=Math.max(1,Math.round(height*scale));
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(im,im.naturalWidth*left/100,im.naturalHeight*top/100,width,height,0,0,canvas.width,canvas.height);
    if(await changeDocument(id,k,canvas.toDataURL('image/jpeg',.72))){
      render();
      openDocuments(id);
    }
  };
}

    render();

function showLogin(){document.body.classList.remove('app-open');$('summary').innerHTML='';$('tabs').innerHTML='';$('main').innerHTML='';$('modalroot').innerHTML='';let root=document.getElementById('loginroot');if(!root){root=document.createElement('div');root.id='loginroot';document.body.append(root)}root.innerHTML=`<section class="panel" style="max-width:420px;margin:8vh auto"><h2>🔒 برنامج رواتب أوتار</h2><p>${authRecord?'أدخل اسم المستخدم وكلمة المرور للدخول':'اسم المستخدم Omar — أول تشغيل: اختر كلمة مرور للبرنامج'}</p><form onsubmit="submitLogin(event)"><label>اسم المستخدم</label><input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr"><label>كلمة المرور</label><input type="password" name="password" required ${authRecord?'':'minlength="6"'} autocomplete="${authRecord?'current-password':'new-password'}">${authRecord?'':'<label>تأكيد كلمة المرور</label><input type="password" name="confirm" required autocomplete="new-password">'}<p id="loginError" role="alert"></p><button class="primary">${authRecord?'دخول':'حفظ كلمة المرور والدخول'}</button></form><p class="muted">قفل محلي لهذا المتصفح، وليس تشفيراً للبيانات. احتفظ بكلمة المرور وبنسخة احتياطية.</p></section>`}
async function passwordHash(password,salt){let key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);let bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt),iterations:210000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits),x=>x.toString(16).padStart(2,'0')).join('')}
async function makePassword(password){let salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));return {salt,hash:await passwordHash(password,salt)}}
async function submitLogin(e){e.preventDefault();let f=e.target,b=f.querySelector('button');b.disabled=true;try{if(f.elements.username.value.trim()!=='Omar')throw Error('اسم المستخدم أو كلمة المرور غير صحيحة');let p=f.elements.password.value;if(!authRecord){if(p.length<6||p!==f.elements.confirm.value)throw Error('اكتب 6 أحرف أو أرقام على الأقل وتأكد من تطابق الكلمتين');let record=await makePassword(p);localStorage.setItem(AUTH_KEY,JSON.stringify(record));authRecord=record}else if(await passwordHash(p,authRecord.salt)!==authRecord.hash)throw Error('كلمة المرور غير صحيحة');unlocked=true;$('loginroot').remove();document.body.classList.add('app-open');render()}catch(err){$('loginError').textContent=crypto.subtle?err.message:'افتح البرنامج عبر HTTPS حتى يعمل قفل كلمة المرور';b.disabled=false}}
function lockApp(){unlocked=false;selected=null;showLogin()}

async function savePasswordChange(e){e.preventDefault();let f=e.target;try{if(await passwordHash(f.current.value,authRecord.salt)!==authRecord.hash)throw Error('كلمة المرور الحالية غير صحيحة');if(f.next.value.length<6||f.next.value!==f.confirm.value)throw Error('الجديدة لا تقل عن 6 أحرف أو أرقام ويجب تطابق التأكيد');let record=await makePassword(f.next.value);localStorage.setItem(AUTH_KEY,JSON.stringify(record));authRecord=record;closeModal();alert('تم تغيير كلمة المرور')}catch(err){$('passwordError').textContent=err.message}}
function normalizePhone(value){let s=String(value||'').replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/[\s()+.\-]/g,'');if(s.startsWith('00'))s=s.slice(2);if(/^07\d{9}$/.test(s))s='964'+s.slice(1);if(/^7\d{9}$/.test(s))s='964'+s;return /^[1-9]\d{7,14}$/.test(s)?s:''}
let messageDraft='',messageQueue=[],openedPhones=new Set();
function whatsappMessagesView(){return `<section class="panel"><h2>توجيه للكادر عبر واتساب</h2><p>اكتب رسالة واحدة لجميع أرقام الموظفين المسجلة. جهّز القائمة ثم افتح واتساب لكل رقم واضغط إرسال داخله.</p><label>نص التوجيه</label><textarea id="staffMessage" rows="5" oninput="messageDraft=this.value">${esc(messageDraft)}</textarea><label><input id="includeFormer" type="checkbox" checked style="width:auto"> تضمين الموظفين المنتهية خدماتهم أيضاً</label><p class="muted">الرقم العراقي: 07xxxxxxxxx أو +9647xxxxxxxxx. للأرقام الدولية أضف رمز البلد.</p><button class="primary" onclick="prepareMessages()">تجهيز الرسالة لجميع الأرقام</button><div id="messageRecipients"></div><p class="muted">فتح المحادثة لا يعني إرسال الرسالة أو تسليمها. الإرسال التلقائي للجميع يحتاج ربطاً رسمياً بخدمة واتساب للأعمال.</p></section>`}
function prepareMessages(){messageDraft=$('staffMessage').value.trim();if(!messageDraft){alert('اكتب الرسالة أولاً');return}let seen=new Set(),invalid=[],duplicates=0;messageQueue=[];openedPhones.clear();db.workers.filter(w=>$('includeFormer').checked||w.active!==false).forEach(w=>{let phone=normalizePhone(w.phone);if(!phone){invalid.push(w.name);return}if(seen.has(phone)){duplicates++;return}seen.add(phone);messageQueue.push({name:w.name,phone,text:messageDraft})});$('messageRecipients').innerHTML=`<h3>معاينة الرسالة</h3><p style="white-space:pre-wrap">${esc(messageDraft)}</p><p>${messageQueue.length} رقم صالح · ${duplicates} رقم مكرر تم تجاوزه</p>${invalid.length?`<p role="alert">رقم ناقص أو غير صالح: ${invalid.map(esc).join('، ')}</p>`:''}${messageQueue.map((w,i)=>`<div class="item between"><span>${esc(w.name)}<br><bdi>+${w.phone}</bdi></span><button id="wa_${i}" onclick="openStaffMessage(${i})">فتح واتساب</button></div>`).join('')||'<p>لا توجد أرقام صالحة.</p>'}`}
function openStaffMessage(i){let w=messageQueue[i];if(!w)return;window.open('https://wa.me/'+w.phone+'?text='+encodeURIComponent(w.text),'_blank','noopener');openedPhones.add(w.phone);$('wa_'+i).textContent='فُتحت المحادثة — فتح مجدداً'}
let smsBusy=false,smsBatchId='',smsResult=null,smsLastPayload='';
function smsRecipients(){let seen=new Set(),valid=[],invalid=[],duplicates=0;db.workers.filter(w=>$('smsFormer').checked||w.active!==false).forEach(w=>{let p=normalizePhone(w.phone);if(!p){invalid.push(w.name);return}if(seen.has(p)){duplicates++;return}seen.add(p);valid.push({name:w.name,phone:'+'+p})});return {valid,invalid,duplicates}}
function messagesView(){return `<section class="panel"><h2>إرسال SMS للجميع</h2><p>اكتب رسالة واحدة لتصل لكل رقم محفوظ بشكل منفصل، بدون فتح تطبيق آخر.</p><p class="muted">يتطلب تفعيل خدمة SMS على الخادم. تُحسب الكلفة حسب الأرقام وأجزاء الرسالة، وقد تُحسب الرسالة العربية الطويلة عدة رسائل.</p><label>نص الرسالة</label><textarea id="smsText" rows="5" maxlength="1600" oninput="messageDraft=this.value">${esc(messageDraft)}</textarea><label><input type="checkbox" id="smsFormer" checked style="width:auto"> تضمين المنتهية خدماتهم</label><label>رمز إرسال SMS</label><input type="password" id="smsAccess" autocomplete="off" placeholder="رمز خاص يضبط عند تفعيل الخدمة"><p class="muted">هذا الرمز منفصل عن كلمة مرور البرنامج ولا يُحفظ في النسخ الاحتياطية.</p><button class="primary" id="smsSend" onclick="sendAllSms()" ${smsBusy?'disabled':''}>${smsBusy?'جارٍ الإرسال…':'إرسال للجميع'}</button><div id="smsResults" role="status" aria-live="polite"></div></section><details class="panel"><summary>واتساب اليدوي</summary>${whatsappMessagesView()}</details>`}
function drawSmsResults(){if(!$('smsResults')||!smsResult)return;$('smsResults').innerHTML='<h3>نتيجة طلب الإرسال</h3>'+smsResult.map(r=>`<div class="item"><bdi>${esc(r.phone)}</bdi> — ${esc(r.state==='accepted'?'قبلت الخدمة الطلب — ليس تأكيد تسليم':r.state==='unknown'?'النتيجة غير مؤكدة؛ راجع لوحة الخدمة قبل إعادة الإرسال':'رفضت الخدمة الطلب')}${r.code?' ('+esc(r.code)+')':''}</div>`).join('')}
async function sendAllSms(){if(smsBusy)return;let text=$('smsText').value.trim(),token=$('smsAccess').value.trim(),r=smsRecipients();if(!text||!token){alert('اكتب الرسالة ورمز الإرسال');return}if(!r.valid.length){alert('لا توجد أرقام صالحة');return}if(r.valid.length>500){alert('الحد الأقصى 500 رقم في الدفعة');return}if(location.protocol==='file:'){alert('الإرسال يحتاج تشغيل النسخة على استضافة تدعم الخادم؛ فتح HTML وحده لا يكفي');return}let preview=`إرسال مدفوع إلى ${r.valid.length} رقم؟\nالمكرر المستبعد: ${r.duplicates}\nالأرقام الناقصة أو غير الصالحة: ${r.invalid.length}${r.invalid.length?'\n'+r.invalid.join('، '):''}\n\n${text}`;if(!confirm(preview))return;let payload=JSON.stringify({text,phones:r.valid.map(x=>x.phone)});if(payload!==smsLastPayload){smsBatchId=crypto.randomUUID();smsLastPayload=payload}smsBusy=true;$('smsSend').disabled=true;$('smsResults').textContent='جارٍ إرسال الطلب… لا تغلق الصفحة.';try{let res=await fetch('/api/sms',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({...JSON.parse(payload),id:smsBatchId})});let data=await res.json();if(!res.ok)throw Error(data.error||'تعذر الإرسال');smsResult=data.results;drawSmsResults();if(smsResult.every(x=>x.state==='failed')){smsLastPayload=''}else{$('smsResults').insertAdjacentHTML('beforeend','<p>نفس الرسالة ونفس القائمة تستخدم رقم الدفعة ذاته لتجنب التكرار. لإرسال جديد مقصود اضغط الزر أدناه.</p><button onclick="if(confirm(\'إنشاء دفعة جديدة قد يكرر الرسالة ويضيف كلفة. متأكد؟\')){smsLastPayload=\'\';this.disabled=true}">السماح بدفعة جديدة</button>')}}catch(e){$('smsResults').textContent='تعذر تأكيد النتيجة: '+e.message+' . أعد المحاولة بنفس النص والقائمة لاسترجاع نفس الدفعة؛ لا تغيّر النص قبل مراجعة الخدمة.'}finally{smsBusy=false;if($('smsSend'))$('smsSend').disabled=false}}

function paidExpenseRows(date,group='all'){
 const workers=[...db.workers,...(db.trash||[])];
 return db.ops.filter(o=>(o.type==='paid'||o.type==='advance')&&o.date===date).filter(o=>{
 const w=workers.find(w=>w.id===o.worker);
 return group==='all'||(group==='delivery'?w?.delivery===true:w&&!w.delivery);
 });
}
function paidExpensePanel(){
 return '<section class="panel no-print"><h2>مصروف الرواتب والسلف الفعلي</h2><label>تاريخ الصرف</label><input type="date" id="paidExpenseDate" value="'+todayISO()+'" onchange="drawPaidExpense()"><label>الفئة</label><select id="paidExpenseGroup" onchange="drawPaidExpense()"><option value="all">العمال والدلفري</option><option value="workers">العمال</option><option value="delivery">الدلفري</option></select><div id="paidExpenseResult"></div></section>';
}
function paidExpenseText(date,group){
 const rows=paidExpenseRows(date,group),total=rows.reduce((a,o)=>a+(Number(o.amount)||0),0);
 return (group==='delivery'?'رواتب وسلف الدلفري':group==='workers'?'رواتب وسلف العمال':'رواتب وسلف العمال والدلفري')+' — '+dateDMY(date)+' — '+fmt(total);
}

let payrollTransferWindow=null,payrollTransferPayload=null;
function transferPaidExpense(){
 const date=$('paidExpenseDate').value,group=$('paidExpenseGroup').value;
 const rows=paidExpenseRows(date,group),workers=[...db.workers,...(db.trash||[])];
 if(!rows.length)return alert('لا توجد رواتب أو سلف مصروفة بهذا التاريخ');
 payrollTransferPayload={type:'awtar-payroll-transfer-v1',rows:rows.map(o=>({id:String(o.id),kind:o.type,date:o.date,amount:Number(o.amount),name:workers.find(w=>w.id===o.worker)?.name||'عامل',group:workers.find(w=>w.id===o.worker)?.delivery?'delivery':'workers'}))};

async function updateAwtarApp(button){
 const status=document.getElementById('awtar-update-status');
 if(document.querySelector('#modalroot form')||document.querySelector('#main form')){status.textContent='احفظ التعديل المفتوح أو أغلقه قبل تحديث البرنامج.';return;}
 if(location.protocol==='file:'){status.textContent='افتح رابط البرنامج المنشور حتى تقدر تحدّثه.';return;}
 button.disabled=true;status.textContent='جارٍ جلب أحدث نسخة…';
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 try{
  await pendingSave;
  const target=new URL(location.href);target.searchParams.set('awtar_update',Date.now().toString());
  const response=await fetch(target.href,{cache:'no-store',signal:controller.signal});
  if(!response.ok)throw Error('update');
  const page=await response.text();
  if(!page.includes('awtar_staff_pro_v4')||!page.includes('AWTAR STAFF PRO'))throw Error('invalid');
  status.textContent='تم جلب النسخة، جارٍ فتح البرنامج…';
  location.replace(target.href);
 }catch(error){status.textContent='تعذّر التحديث. تأكد من الإنترنت وحاول مرة ثانية؛ بياناتك محفوظة.';button.disabled=false;}
 finally{clearTimeout(timeout);}
}
